name: Publish

on:
  push:
    tags: ['petit-ui@*']

permissions:
  contents: read

concurrency:
  group: publish-petit-ui
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      # npm provenance requires a public source repository.
      NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate release tag and main ancestry
        id: release
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node .github/scripts/release-metadata.mjs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.16.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack petit-ui
        working-directory: packages/petit-ui
        run: |
          mkdir -p "$RUNNER_TEMP/petit-ui-release"
          npm pack --pack-destination "$RUNNER_TEMP/petit-ui-release"
      - name: Publish to npm with OIDC
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: |
          npm publish "$RUNNER_TEMP/petit-ui-release/petit-ui-${PACKAGE_VERSION}.tgz" \
            --tag "$DIST_TAG" --access public --registry https://registry.npmjs.org
