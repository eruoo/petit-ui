[changelog]
header = "# 更新日志\n\n"
body = """
{% if version %}
## {{ version | trim_start_matches(pat="petit-ui@") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## 未发布
{% endif %}
{% set release_commits = commits | filter(attribute="group", value="版本发布") | filter(attribute="breaking", value=false) %}
{% if commits | length == release_commits | length %}
无新增变更。
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
{% if group == "版本发布" %}
{% set commits = commits | filter(attribute="breaking", value=true) %}
{% endif %}
{% if commits | length > 0 %}
### {{ group }}
{% for commit in commits %}
- {% if commit.breaking %}**破坏性变更** {% endif %}{% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message }}{% if commit.id %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/eruoo/petit-ui/commit/{{ commit.id }})){% endif %}
{% endfor %}
{% endif %}
{% endfor %}
"""
trim = true
format = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
include_paths = ["packages/petit-ui/**"]
tag_pattern = '^petit-ui@[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
sort_commits = "oldest"
commit_parsers = [
  # 保留只有版本提交的历史分段，模板中隐藏这些提交的条目。
  { message = '^chore\(release\):', group = "版本发布" },
  { message = '^feat', group = "新增功能" },
  { message = '^fix', group = "问题修复" },
  { message = '^perf', group = "性能优化" },
  { message = '^refactor', group = "代码重构" },
  { message = '^docs', group = "文档" },
  { message = '^revert', group = "回退" },
  { message = '.*', group = "其他变更" },
]
